# Cloudflare Pages + D1 — Fintech Intelligence
#
# Deploy from the repository root:
#   npx wrangler pages deploy frontend/.vercel/output/static --project-name fintech-intelligence
# Create the database first (once):
#   npx wrangler d1 create fintech-intelligence-db
#   npx wrangler d1 execute fintech-intelligence-db --file=./schema.sql --remote
#
# The Pages project root is `frontend`, so its build command is:
#   npm run pages:build

name = "fintech-intelligence"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Output produced by `npx @cloudflare/next-on-pages` inside frontend/.
pages_build_output_dir = "frontend/.vercel/output/static"
