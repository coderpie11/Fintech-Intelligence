# Render blueprint — Fintech Intelligence FastAPI backend
#
# One-click deploy: Render Dashboard → New → Blueprint → pick this repo.
# The service ships a compressed snapshot of the fully seeded SQLite store
# (backend/data/seed/bfi.db.gz); app/core/config.py and backend/run.py restore
# it on first boot, so a fresh deploy comes up with data — no seeding call.
#
# NOTE: Render's filesystem is ephemeral on the free/starter plans, so the
# restored backend/data/bfi.db is rebuilt on every deploy/restart. Attach a
# persistent disk + DATA_DIR only if you need locally-written rows to survive.

services:
  - type: web
    name: fintech-intelligence-backend
    env: python
    plan: starter
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python run.py
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # 3.14 has no cp314 wheels for curl_cffi/uvloop, and the source builds
      # that get picked instead segfault the container (exit status 139).
      - key: PYTHON_VERSION
        value: 3.11.9
      # Boot-time warmups stay off on the 512 MB instance. The snapshot already
      # holds every row; user requests still fetch live quotes and build charts.
      - key: ENABLE_SCHEDULER
        value: "false"
      # Live quotes stay on. The adapter caps each Yahoo batch at 25 tickers,
      # runs one batch at a time, and calls gc.collect() after each batch.
      - key: ENABLE_LIVE_QUOTES
        value: "true"
      # Public origins of the deployed Cloudflare Pages frontend, so the
      # browser can call the API directly when /bff rewrites are unavailable.
      - key: CORS_ORIGINS
        value: https://fintech-intelligence.pages.dev,https://fintechintelligence.coderpie.tech
