# Render blueprint — Fintech Intelligence FastAPI backend
#
# One-click deploy: Render Dashboard → New → Blueprint → pick this repo.
# The service ships a compressed snapshot of a fully seeded SQLite store
# (backend/data/seed/bfi.db.gz); app/core/config.py restores it on first boot,
# so a fresh deploy comes up with data — no seeding call needed.
#
# NOTE: Render's filesystem is ephemeral on the free/starter plans, so the
# restored backend/data/bfi.db is rebuilt on every deploy/restart. Attach a
# persistent disk + DATA_DIR only if you need locally-written rows to survive.

services:
  - type: web
    name: fintech-intelligence-backend
    env: python
    plan: starter
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python run.py
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # 3.14 has no cp314 wheels for curl_cffi/uvloop, and the source builds
      # that get picked instead segfault the container (exit status 139).
      - key: PYTHON_VERSION
        value: 3.11.9
      # Boot-time scraping/scheduling is off: the shipped snapshot is already
      # seeded and the free 512 MB instance cannot afford a warmup pass.
      - key: ENABLE_SCHEDULER
        value: "false"
      # Public origin of the deployed Cloudflare Pages frontend, so the
      # browser can call the API directly when /bff rewrites are unavailable.
      - key: CORS_ORIGINS
        sync: false
