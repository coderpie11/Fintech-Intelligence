# Render blueprint — Fintech Intelligence FastAPI backend
#
# One-click deploy: Render Dashboard → New → Blueprint → pick this repo.
# After the first boot the SQLite store is empty; populate it once with:
#   curl -X POST https://<service>.onrender.com/api/v1/refresh/all
# (or run `python -m app.seed.seed` from the Render shell).
#
# NOTE: Render's filesystem is ephemeral on the free/starter plans, so
# backend/data/bfi.db is rebuilt on every deploy. Attach a persistent disk
# and set DATA_DIR if you need the imported history to survive restarts.

services:
  - type: web
    name: fintech-intelligence-backend
    env: python
    plan: starter
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python run.py
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # Public origin of the deployed Cloudflare Pages frontend, so the
      # browser can call the API directly when /bff rewrites are unavailable.
      - key: CORS_ORIGINS
        sync: false
