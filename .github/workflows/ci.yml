name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest already ships a modern CPython. The suite is written to run
      # on any 3.11+ interpreter (verified here on 3.13), and — unlike
      # setup-python — there is nothing to download, so the job cannot fail while
      # provisioning a toolchain. The deploy pin (backend/runtime.txt) is
      # unchanged.
      - name: Report the interpreter
        run: python -V

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Restore the shipped database snapshot
        run: python -c "from app.core.config import restore_snapshot_if_missing; restore_snapshot_if_missing()"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Verify the X-Ray contract offline
        run: python scripts/verify_xray.py

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build

  # Render redeploys main automatically. This job waits for that deploy and
  # then asserts the live payload is fully populated, so a half-empty X-Ray
  # fails the pipeline instead of reaching users.
  production-smoke:
    name: Production smoke (post-deploy)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the deploy to settle and verify the live X-Ray
        env:
          TARGET: https://fintech-intelligence-pmuw.onrender.com
        run: |
          # The contract check is stdlib-only, so no install is needed here.
          python backend/scripts/verify_xray.py \
            --url "$TARGET" --attempts 15 --wait 40
